apiVersion: apps/v1
kind: Deployment
metadata:
  name: mecanica-api
  namespace: mecanica
  labels:
    app: mecanica-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: mecanica-api
  template:
    metadata:
      labels:
        app: mecanica-api
      annotations:
        ad.datadoghq.com/mecanica-api.logs: '[{"source":"java","service":"mecanica-api"}]'
        ad.datadoghq.com/mecanica-api.checks: >-
          {
            "openmetrics": {
              "init_config": {},
              "instances": [{
                "openmetrics_endpoint": "http://%%host%%:8080/actuator/prometheus",
                "namespace": "mecanica",
                "metrics": [
                  {"mecanica_ordens_servico_criadas_total": "ordens_servico.criadas"},
                  {"mecanica_ordens_servico_status_transicoes_total": "ordens_servico.status.transicoes"},
                  {"mecanica_ordens_servico_status_duracao_seconds_sum": "ordens_servico.status.duracao.sum"},
                  {"mecanica_ordens_servico_status_duracao_seconds_count": "ordens_servico.status.duracao.count"},
                  {"mecanica_ordens_servico_processamento_falhas_total": "ordens_servico.processamento.falhas"},
                  {"http_server_requests_seconds_sum": "api.http.requests.duration.sum"},
                  {"http_server_requests_seconds_count": "api.http.requests.duration.count"}
                ]
              }]
            },
            "http_check": {
              "init_config": {},
              "instances": [{
                "name": "mecanica-api-health",
                "url": "http://%%host%%:8080/actuator/health",
                "timeout": 5,
                "tags": ["service:mecanica-api"]
              }]
            }
          }
    spec:
      containers:
        - name: mecanica-api
          image: mecanica-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: mecanica-api-config
            - secretRef:
                name: mecanica-api-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
