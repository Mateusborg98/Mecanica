name: CI/CD - Mecânica

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches:
      - homolog
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  KIND_VERSION: v0.31.0
  KUBECONFIG: ${{ github.workspace }}/infra/cluster/kubeconfig

jobs:
  build-test-deploy:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Permitir execução do Maven Wrapper
        run: chmod +x mvnw

      - name: Rodar testes e validar JaCoCo
        run: ./mvnw verify

      - name: Build da imagem Docker
        run: docker build -t mecanica-api:latest .

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Validar formatação do Terraform
        run: terraform fmt -check -recursive infra

      - name: Validar Terraform dos recursos da aplicação
        run: |
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra validate

      - name: Validar Terraform do cluster local
        run: |
          terraform -chdir=infra/cluster init -backend=false
          terraform -chdir=infra/cluster validate

      - name: Instalar Kind
        run: |
          curl -Lo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x kind
          sudo mv kind /usr/local/bin/kind

      - name: Provisionar cluster Kubernetes com Terraform
        run: >-
          terraform -chdir=infra/cluster apply
          -auto-approve
          -var="cluster_name=mecanica-ci"

      - name: Instalar Metrics Server no Kind
        shell: pwsh
        run: |
          ./scripts/install-metrics-server-kind.ps1 `
            -Kubeconfig $env:KUBECONFIG `
            -TimeoutSeconds 240

      - name: Carregar imagem Docker no cluster
        run: kind load docker-image mecanica-api:latest --name mecanica-ci

      - name: Aplicar banco e manifestos Kubernetes
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/

      - name: Aguardar PostgreSQL e aplicação
        run: |
          kubectl rollout status deployment/mecanica-db -n mecanica --timeout=240s
          kubectl rollout status deployment/mecanica-api -n mecanica --timeout=360s

      - name: Validar recursos implantados
        run: |
          kubectl get deployments,services,pods,hpa,pvc -n mecanica

          kubectl top nodes
          kubectl top pods -n mecanica
          kubectl get hpa -n mecanica

          kubectl port-forward service/mecanica-api 18080:8080 -n mecanica > port-forward.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:18080/actuator/health; then
              exit 0
            fi
            sleep 2
          done

          cat port-forward.log
          exit 1

      - name: Diagnóstico do cluster em caso de falha
        if: failure()
        run: |
          kubectl get all,pvc -n mecanica || true
          kubectl describe pods -n mecanica || true
          kubectl logs deployment/mecanica-api -n mecanica --tail=200 || true
          kubectl logs deployment/mecanica-db -n mecanica --tail=200 || true

      - name: Destruir cluster efêmero
        if: always()
        run: >-
          terraform -chdir=infra/cluster destroy
          -auto-approve
          -var="cluster_name=mecanica-ci"
