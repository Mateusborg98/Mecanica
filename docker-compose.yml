services:

  postgres:
    image: postgres:16
    container_name: mecanica-db
    restart: always
    environment:
      POSTGRES_DB: mecanica
      POSTGRES_USER: mecanica
      POSTGRES_PASSWORD: mecanica
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mecanica -d mecanica"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: mecanica-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?Defina JWT_PUBLIC_KEY com a chave publica RSA}
      JWT_ISSUER: ${JWT_ISSUER:-mecanica-auth}
    ports:
      - "8080:8080"

volumes:
  postgres_data:
