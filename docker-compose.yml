version: "3.8"

services:

  postgres:
    image: postgres:16
    container_name: mecanica-db
    restart: always
    environment:
      POSTGRES_DB: mecanica
      POSTGRES_USER: mecanica
      POSTGRES_PASSWORD: mecanica
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: mecanica-api
    restart: always
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mecanica
      SPRING_DATASOURCE_USERNAME: mecanica
      SPRING_DATASOURCE_PASSWORD: mecanica
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"

volumes:
  postgres_data:
